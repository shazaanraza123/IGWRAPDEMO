name: IGWrapped
options:
  bundleIdPrefix: com.igwrapped
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    exactVersion: 2.55.4
targets:
  IGWrapped:
    type: application
    platform: iOS
    sources:
      - path: IGWrapped
        excludes:
          - "**/.gitkeep"
      - path: ../design/reference/instagram/01-home.png
        buildPhase: resources
      - path: ../design/reference/instagram/05-story-viewer.png
        buildPhase: resources
      - path: ../design/photos/feed-chicago.jpg
        buildPhase: resources
      - path: ../design/photos/tile-1.jpg
        buildPhase: resources
      - path: ../design/photos/tile-2.jpg
        buildPhase: resources
      - path: ../design/photos/tile-3.jpg
        buildPhase: resources
      - path: ../design/photos/tile-4.jpg
        buildPhase: resources
      - path: ../design/photos/tile-5.jpg
        buildPhase: resources
      - path: ../design/screens/01-opening.png
        buildPhase: resources
      - path: ../design/screens/02-year-in-memories.png
        buildPhase: resources
      - path: ../design/screens/03-feed-color.png
        buildPhase: resources
      - path: ../design/screens/04-your-algorithm.png
        buildPhase: resources
    dependencies:
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.igwrapped.IGWrapped
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: IGWrapped/Info.plist
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets:
        - IGWrappedTests
        - IGWrappedUITests
  IGWrappedTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: IGWrappedTests
    dependencies:
      - target: IGWrapped
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.igwrapped.IGWrappedTests
  IGWrappedUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: IGWrappedUITests
    dependencies:
      - target: IGWrapped
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.igwrapped.IGWrappedUITests
schemes:
  IGWrapped:
    build:
      targets:
        IGWrapped: all
        IGWrappedTests: [test]
        IGWrappedUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - IGWrappedTests
        - IGWrappedUITests
