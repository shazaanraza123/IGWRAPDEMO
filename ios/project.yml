name: IGWrapped
options:
  bundleIdPrefix: com.igwrapped
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    exactVersion: 2.55.4
targets:
  IGWrapped:
    type: application
    platform: iOS
    sources:
      - path: IGWrapped
        excludes:
          - "**/.gitkeep"
          - "Resources/Brand/**"
      - path: ../design/reference/instagram/01-home.png
        buildPhase: resources
      - path: ../design/reference/instagram/01-home-2026.png
        buildPhase: resources
      - path: ../design/reference/instagram/05-story-viewer.png
        buildPhase: resources
      - path: ../design/photos/feed-chicago.jpg
        buildPhase: resources
      - path: ../design/photos/tile-1.jpg
        buildPhase: resources
      - path: ../design/photos/tile-2.jpg
        buildPhase: resources
      - path: ../design/photos/tile-3.jpg
        buildPhase: resources
      - path: ../design/photos/tile-4.jpg
        buildPhase: resources
      - path: ../design/photos/tile-5.jpg
        buildPhase: resources
      - path: ../design/screens/01-opening.png
        buildPhase: resources
      - path: ../design/screens/02-year-in-memories.png
        buildPhase: resources
      - path: ../design/screens/03-feed-color.png
        buildPhase: resources
      - path: ../design/screens/04-your-algorithm.png
        buildPhase: resources
      - path: ../design/screens/05-reels-rabbit-hole.png
        buildPhase: resources
      - path: ../design/screens/06-main-character-post.png
        buildPhase: resources
      - path: ../design/screens/07-broke-the-group-chat.png
        buildPhase: resources
      - path: ../design/screens/08-your-circle.png
        buildPhase: resources
      - path: ../design/screens/09-3am-club.png
        buildPhase: resources
      - path: ../design/screens/10-plot-twist.png
        buildPhase: resources
      - path: ../design/screens/11-personality-teaser.png
        buildPhase: resources
      - path: ../design/screens/12-personality-reveal.png
        buildPhase: resources
      - path: ../design/screens/13a-identity-card.png
        buildPhase: resources
      - path: ../design/screens/13b-numbers-card.png
        buildPhase: resources
      - path: ../design/screens/personality-marks.png
        buildPhase: resources
      - path: ../design/photos/main-character.jpg
        buildPhase: resources
      - path: ../design/photos/year-card.jpg
        buildPhase: resources
      - path: ../design/photos/friend-dee.jpg
        buildPhase: resources
      - path: ../design/photos/friend-nico.jpg
        buildPhase: resources
      - path: ../design/photos/friend-sam.jpg
        buildPhase: resources
      - path: ../design/photos/friend-tori.jpg
        buildPhase: resources
      - path: ../design/photos/story-0314.jpg
        buildPhase: resources
      - path: ../design/photos/m-01.jpg
        buildPhase: resources
      - path: ../design/photos/m-02.jpg
        buildPhase: resources
      - path: ../design/photos/m-03.jpg
        buildPhase: resources
      - path: ../design/photos/m-04.jpg
        buildPhase: resources
      - path: ../design/photos/m-05.jpg
        buildPhase: resources
      - path: ../design/photos/m-06.jpg
        buildPhase: resources
      - path: ../design/photos/m-07.jpg
        buildPhase: resources
      - path: ../design/photos/m-08.jpg
        buildPhase: resources
      - path: ../design/photos/m-09.jpg
        buildPhase: resources
      - path: ../design/photos/m-10.jpg
        buildPhase: resources
      - path: ../design/photos/m-11.jpg
        buildPhase: resources
    dependencies:
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.igwrapped.IGWrapped
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: IGWrapped/Info.plist
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets:
        - IGWrappedTests
        - IGWrappedUITests
    postBuildScripts:
      - name: Copy brand assets
        basedOnDependencyAnalysis: false
        script: |
          brand="${SRCROOT}/IGWrapped/Resources/Brand"
          dest="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          mkdir -p "$dest"
          if [ -d "$brand" ]; then
            find "$brand" -type f \( -name '*.pdf' -o -name '*.png' \) -exec cp {} "$dest/" \;
          fi
          fonts="${SRCROOT}/../design/fonts"
          if [ -d "$fonts" ]; then
            find "$fonts" -type f \( -name 'InstagramSans*' -o -name 'InstagramMono*' \) -exec cp {} "$dest/" \;
          fi
  IGWrappedTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: IGWrappedTests
      - path: IGWrapped/Resources/Runs
        buildPhase: resources
    dependencies:
      - target: IGWrapped
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.igwrapped.IGWrappedTests
  IGWrappedUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: IGWrappedUITests
    dependencies:
      - target: IGWrapped
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.igwrapped.IGWrappedUITests
schemes:
  IGWrapped:
    build:
      targets:
        IGWrapped: all
        IGWrappedTests: [test]
        IGWrappedUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - IGWrappedTests
        - IGWrappedUITests
